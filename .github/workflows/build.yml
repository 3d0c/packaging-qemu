name: Build QEMU RPM Packages

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - nvidia_stable-10.1

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/NVIDIA/QEMU.git
  PULP_DEBUG: "1"

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Job 1 — Build SRPM
  # ────────────────────────────────────────────────────────────────────────
  build-srpm:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
    outputs:
      commit_sha: ${{ steps.parse.outputs.commit_sha }}
    steps:
      - name: Install prerequisites
        run: |
          dnf install -y git rpm-build rpmdevtools xz findutils python3-pip
          pip3 install meson pulp-cli

      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Parse build request
        id: parse
        shell: bash
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          COMMIT_MSG=$(git log -1 --format='%s')

          for MSG in "$PR_TITLE" "$COMMIT_MSG"; do
            if [[ "$MSG" =~ build:[[:space:]]*([a-f0-9]+) ]]; then
              SHA="${BASH_REMATCH[1]}"
              echo "commit_sha=${SHA}" >> "$GITHUB_OUTPUT"
              echo "Build request for upstream commit: ${SHA}"
              exit 0
            fi
          done

          echo "::notice::No 'build: <sha>' pattern found — skipping."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        if: steps.parse.outputs.skip != 'true'
        run: |
          chmod +x scripts/create-tarball.sh
          scripts/create-tarball.sh "${{ steps.parse.outputs.commit_sha }}"

      - name: Update spec file
        if: steps.parse.outputs.skip != 'true'
        run: |
          chmod +x scripts/update-spec.sh
          scripts/update-spec.sh "${{ steps.parse.outputs.commit_sha }}"

      - name: Build SRPM
        if: steps.parse.outputs.skip != 'true'
        run: |
          rpmdev-setuptree
          cp SOURCES/* ~/rpmbuild/SOURCES/
          cp SPECS/qemu-kvm.spec ~/rpmbuild/SPECS/
          rpmbuild -bs ~/rpmbuild/SPECS/qemu-kvm.spec \
            --define "_topdir $HOME/rpmbuild"

      - name: Collect SRPM
        if: steps.parse.outputs.skip != 'true'
        run: |
          mkdir -p srpm-output
          cp ~/rpmbuild/SRPMS/*.src.rpm srpm-output/

      - name: Upload SRPM
        id: upload-srpm
        if: steps.parse.outputs.skip != 'true'
        # Keep SRPM as a workflow artifact for intra-run handoff to matrix RPM builds.
        # We also upload SRPM to Pulp below, but that upload is done with --no-publish.
        # Until publish runs, matrix jobs cannot reliably consume SRPM via Pulp repos.
        uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: srpm-output/*.src.rpm

      - name: Configure pulp-cli
        if: steps.parse.outputs.skip != 'true'
        env:
          PULP_USERNAME: ${{ vars.PULP_USERNAME }}
          PULP_PASSWORD: ${{ secrets.PULP_PASSWORD }}
          PULP_BASE_URL: ${{ vars.PULP_BASE_URL }}
        run: |
          source scripts/pulp-common.sh
          configure_pulp_cli

      - name: Upload SRPM to Pulp
        if: steps.parse.outputs.skip != 'true'
        env:
          PULP_RPM_REPOSITORY: ${{ vars.PULP_RPM_REPOSITORY }}
          PULP_SRPM_REPOSITORY: ${{ vars.PULP_SRPM_REPOSITORY }}
        run: |
          # Store SRPM content early in Pulp, but defer repository publication to final job.
          # This keeps publication atomic after both architecture builds complete.
          source scripts/pulp-common.sh
          : "${PULP_RPM_REPOSITORY:?PULP_RPM_REPOSITORY variable is required}"
          TARGET_SRPM_REPOSITORY="${PULP_SRPM_REPOSITORY:-$PULP_RPM_REPOSITORY}"
          upload_packages "./srpm-output" "*.src.rpm" "${TARGET_SRPM_REPOSITORY}" "SRPM"

      - name: "Commit: srpm ready"
        if: steps.parse.outputs.skip != 'true'
        run: |
          SRPM_FILES=$(ls -1 srpm-output/*.src.rpm | xargs -n1 basename)
          ARTIFACT_URL="${{ steps.upload-srpm.outputs.artifact-url }}"

          MSG=$(printf "srpm ready\n\nArtifacts:\n%s\n%s" "$SRPM_FILES" "$ARTIFACT_URL")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SPECS/qemu-kvm.spec
          git commit -m "$MSG"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  # ────────────────────────────────────────────────────────────────────────
  # Job 2 — Build RPMs (rpmbuild --rebuild in CentOS Stream 9 container)
  # ────────────────────────────────────────────────────────────────────────
  build-rpms:
    needs: build-srpm
    if: needs.build-srpm.outputs.commit_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/centos/centos:stream9
    steps:
      - name: Enable repos and install prerequisites
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git rpm-build python3-pip
          python3 -m pip install pulp-cli

      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download SRPM
        # Consume SRPM artifact as a reliable, immediate handoff from build-srpm.
        # Pulp upload in build-srpm is intentionally unpublished until final publish.
        uses: actions/download-artifact@v4
        with:
          name: srpm
          path: ./srpms

      - name: Install SRPM and build dependencies
        run: |
          rpm -i srpms/*.src.rpm
          dnf builddep -y ~/rpmbuild/SPECS/qemu-kvm.spec

      - name: Build RPMs
        run: |
          rpmbuild -bb ~/rpmbuild/SPECS/qemu-kvm.spec \
            --define "_rpmdir $PWD/rpms"

      - name: Configure pulp-cli
        env:
          PULP_USERNAME: ${{ vars.PULP_USERNAME }}
          PULP_PASSWORD: ${{ secrets.PULP_PASSWORD }}
          PULP_BASE_URL: ${{ vars.PULP_BASE_URL }}
        run: |
          source scripts/pulp-common.sh
          configure_pulp_cli

      - name: Upload RPMs to Pulp
        env:
          PULP_RPM_REPOSITORY: ${{ vars.PULP_RPM_REPOSITORY }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          source scripts/pulp-common.sh
          : "${PULP_RPM_REPOSITORY:?PULP_RPM_REPOSITORY variable is required}"
          upload_packages "./rpms" "*.rpm" "${PULP_RPM_REPOSITORY}" "RPM (${TARGET_ARCH})" "${TARGET_ARCH}" "true"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: ~/rpmbuild/BUILD/qemu-*/qemu_kvm_build/meson-logs/

  # ────────────────────────────────────────────────────────────────────────
  # Job 3 — Publish repositories (runs after ALL arch builds succeed)
  # ────────────────────────────────────────────────────────────────────────
  publish:
    needs: [build-srpm, build-rpms]
    if: needs.build-srpm.outputs.commit_sha != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install pulp-cli
        run: python3 -m pip install pulp-cli

      - name: Configure pulp-cli
        env:
          PULP_USERNAME: ${{ vars.PULP_USERNAME }}
          PULP_PASSWORD: ${{ secrets.PULP_PASSWORD }}
          PULP_BASE_URL: ${{ vars.PULP_BASE_URL }}
        run: |
          source scripts/pulp-common.sh
          configure_pulp_cli

      - name: Publish repositories
        env:
          PULP_RPM_REPOSITORY: ${{ vars.PULP_RPM_REPOSITORY }}
          PULP_SRPM_REPOSITORY: ${{ vars.PULP_SRPM_REPOSITORY }}
        run: |
          source scripts/pulp-common.sh
          : "${PULP_RPM_REPOSITORY:?PULP_RPM_REPOSITORY variable is required}"
          publish_repository "${PULP_RPM_REPOSITORY}"

          if [ -n "${PULP_SRPM_REPOSITORY}" ] && [ "${PULP_SRPM_REPOSITORY}" != "${PULP_RPM_REPOSITORY}" ]; then
            publish_repository "${PULP_SRPM_REPOSITORY}"
          fi

      - name: "Commit: rpms ready"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "rpms ready"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
